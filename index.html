<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterOS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="menubar">
        <span><strong>InterOS</strong></span>
        <span id="clock">--:--</span>
    </div>

    <div class="icon" id="about-icon">
        <div class="icon-img">📝</div>
        <span>about</span>
    </div>

    <div class="icon" id="welcome-icon">
        <div class="icon-img">🏠</div>
        <span>welcome</span>
    </div>

    <div class="icon" id="settings-icon">
        <div class="icon-img">⚙️</div>
        <span>settings</span>
    </div>

    <div class="window" id="settings">
        <div class="titlebar" id="settingsheader">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">settings</span>
        </div>
        <div class="content">
            <p>wallpaper</p>
            <button class="wall" id="wall-sky">sky</button>
            <button class="wall" id="wall-sunset">sunset</button>
            <button class="wall" id="wall-night">night</button>
        </div>
    </div>

    <div class="window" id="about">
        <div class="titlebar" id="aboutheader">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">about</span>
        </div>
        <div class="content">
            <p>InterOS by Vihaan</p>
        </div>
    </div>

    <div class="window" id="welcome">
        <div class="titlebar" id="welcomeheader">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">welcome</span>
        </div>
        <div class="content">
            <h1>InterOS</h1>
            <p>Made by Vihaan for stardance 2026</p>
            <img src="icon.png" alt="InterOS Icon" width="150">
            <br>

            <script src="script.js"></script>
            <a href="https://github.com/Vihaan6119">View my code</a>
        </div>
    </div>
</body>
</html>
